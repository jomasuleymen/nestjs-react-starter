name: ${COMPOSE_PROJECT_NAME:-starter}
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    ports:
      - '${DATABASE_PORT}:5432'

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'

    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD}

    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped

    command: /data

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'

    volumes:
      - rustfs_data:/data

    ports:
      - '127.0.0.1:${RUSTFS_API_PORT}:9000'
      - '127.0.0.1:${RUSTFS_CONSOLE_PORT}:9001'

    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
